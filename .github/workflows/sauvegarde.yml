# Copie nocturne de la base Supabase vers la branche « sauvegarde » (fichiers lisibles, historique conservé).
# Secret : CUSPEED_SAUVEGARDE_DB_URL, adresse de connexion du rôle lecteur_sauvegarde (lecture seule),
# rangé dans l'environnement GitHub « sauvegarde » (Settings > Environments), limité à la branche main.
# Jamais en secret de dépôt : une branche modifiée ne doit pas pouvoir le lire.
name: Sauvegarde nocturne

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sauvegarde:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment: sauvegarde
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml==6.0.2 "psycopg[binary]==3.2.3"
      # Deux dossiers : le code vient TOUJOURS de main (dossier de travail, relu et fusionné) ;
      # la branche sauvegarde est extraite à part (${{ runner.temp }}/sauvegarde) et ne sert que de support au dossier data/.
      # Aucun script de la branche sauvegarde n'est jamais exécuté, a fortiori avec le secret.
      - name: Extraire la branche sauvegarde dans un dossier séparé
        run: |
          if git ls-remote --exit-code --heads origin sauvegarde >/dev/null; then
            git worktree add -B sauvegarde "$RUNNER_TEMP/sauvegarde" origin/sauvegarde
          else
            git worktree add --orphan -b sauvegarde "$RUNNER_TEMP/sauvegarde"
          fi
      - name: Exporter la base
        env:
          CUSPEED_DB_URL: ${{ secrets.CUSPEED_SAUVEGARDE_DB_URL }}
        run: python3 scripts/sauvegarder_vers_yaml.py --sortie "$RUNNER_TEMP/sauvegarde/data"
      - name: "Contrôler la copie (erreurs de données, baisse anormale du nombre de fiches)"
        id: controle
        continue-on-error: true
        env:
          CUSPEED_DATA: ${{ runner.temp }}/sauvegarde/data
        run: |
          if git rev-parse --verify origin/sauvegarde >/dev/null 2>&1; then
            python3 scripts/verifier_donnees.py --reference origin/sauvegarde
          else
            python3 scripts/verifier_donnees.py
          fi
      - name: "Enregistrer la copie, même en cas d'alerte (l'historique garde l'état précédent)"
        working-directory: ${{ runner.temp }}/sauvegarde
        run: |
          git config user.name "Sauvegarde Cuspeed"
          git config user.email "contact@cuspeed.fr"
          # Seul le dossier data/ est ajouté : jamais de scripts/ ni de .github/.
          git add data
          if git diff --cached --quiet; then echo "Aucun changement."; else
            git commit -m "Sauvegarde nocturne $(date -u +%F)"
            git push origin sauvegarde
          fi
      - name: Alerter si le contrôle a échoué
        if: steps.controle.outcome == 'failure'
        run: |
          echo "Le contrôle de la copie a signalé une alerte : voir l'étape précédente." >&2
          exit 1
