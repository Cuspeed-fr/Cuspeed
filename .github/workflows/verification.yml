# Contrôles automatiques de chaque pull request et de chaque fusion dans main.
# Une pull request dont un contrôle échoue ne peut pas être fusionnée
# (règle « main » dans Settings > Rules ; contrôles obligatoires : les deux premiers ci-dessous).
name: Vérifications

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  fichiers:
    name: Fichiers du dépôt (secrets, miroir des données)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml==6.0.2
      - name: Contrôle des fichiers et garde-fou contre les suppressions massives
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            python3 scripts/verifier_donnees.py --reference "origin/${{ github.base_ref }}"
          else
            python3 scripts/verifier_donnees.py
          fi

  securite-base:
    name: Base de données (migrations et droits des agents)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # Base de test jetable, sans rapport avec la production ; le mot de passe passe par PGPASSWORD
      PGPASSWORD: test
      DATABASE_URL: postgresql://postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "psycopg[binary]==3.2.3"
      - name: Appliquer les migrations sur une base de test vide, puis le chargement initial
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -f supabase/tests/preparer_base_test.sql
          for f in supabase/migrations/*.sql; do psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -f "$f"; done
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -f supabase/seed.sql
      - name: Tester ce que chaque rôle peut et ne peut pas faire
        run: python3 supabase/tests/test_securite.py

  site:
    name: Site (tests et construction)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    env:
      # Pas d'envoi de statistiques d'usage à l'éditeur d'Astro
      ASTRO_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Installer exactement les versions verrouillées
        run: npm ci
      - name: Tests (aucune fiche non validée ni note interne publiée)
        run: npm test
      - name: Construire le site et contrôler le résultat
        # Construit à partir du miroir data/, qui contient aussi des fiches non validées :
        # le contrôle vérifie justement qu'aucune ne se retrouve dans le site.
        run: npm run build
